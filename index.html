  <style>
    :root {
      --bg: #111111;
      --card: #1a1a1a;
      --border: #2a2a2a;
      --text: #f2f2f2;
      --muted: #8a8a8a;
      --purple: #6e5ad0;
      --purple-soft: #8f7ff0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 36px;
      padding: 56px 40px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .brand img {
      height: 84px;
      width: auto;
      display: block;
    }
    .brand h1 {
      font-size: 34px;
      font-weight: 400;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .bar {
      width: 100%;
      height: 12px;
      background: #2a2a2a;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--purple), var(--purple-soft));
      border-radius: 999px;
      animation: fill 5s linear forwards;
    }
    @keyframes fill { to { width: 100%; } }

    .hint {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }
    .hint a { color: var(--purple-soft); }

    @media (max-width: 480px) {
      .card { padding: 40px 24px 32px; border-radius: 28px; }
      .brand { gap: 14px; }
      .brand img { height: 60px; }
      .brand h1 { font-size: 24px; }
    }
  </style>
</head>
